<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Si el Destino Tiene Nombre, Es el Tuyo</title>

<style>
body{
    margin:0;
    font-family:Georgia, serif;
    background:linear-gradient(135deg,#fff0f3,#ffe6eb);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    background:white;
    width:90%;
    max-width:850px;
    padding:50px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h1{
    color:#c2185b;
    margin-bottom:25px;
}

.frase{
    font-size:24px;
    font-style:italic;
    color:#444;
    margin-bottom:30px;
}

.texto{
    font-size:20px;
    color:#666;
    margin-bottom:30px;
    line-height:1.6;
}

.pregunta{
    font-size:34px;
    color:#c2185b;
    margin-bottom:25px;
}

button{
    border:none;
    background:#c2185b;
    color:white;
    padding:12px 22px;
    margin:8px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    background:#ad1457;
}

#resultado{
    margin-top:30px;
    font-size:26px;
    color:#c2185b;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>Si el Destino Tiene Nombre, Es el Tuyo</h1>

<p class="frase">
"No te quiero por quién eres, te quiero por quién soy cuando estoy contigo."
</p>

<p class="texto">
Karen, hay personas que pasan por nuestra vida y otras que se quedan en nuestros pensamientos.
Tú lograste ambas cosas.
</p>

<div class="pregunta">
¿Quieres ser mi novia? ❤️
</div>

<button onclick="respuesta()">Sí</button>
<button onclick="respuesta()">Shi</button>
<button onclick="respuesta()">No</button>
<button onclick="respuesta()">Tal vez</button>

<div id="resultado"></div>

</div>

<script>
function respuesta(){
 document.getElementById("resultado").innerHTML =
 "💖 ¡Sabía que elegirías la opción correcta! 💖";
}
</script>

</body>
</html>
